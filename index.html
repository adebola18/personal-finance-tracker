<!DOCTYPE html>
<html lang="en">
<head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Ledger: personal finance tracker</title>
          <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bar-top">
    <h1>Ledger</h1>
    <label>Currency symbol
      <input id="cur" maxlength="3" value="$" aria-label="Currency symbol">
    </label>
  </div>

  <div class="balance" id="balance">0.00</div>
  <p class="sub">Current balance</p>
  <div class="split" aria-hidden="true">
    <i class="a" id="barIn" style="width:0"></i>
    <i class="b" id="barOut" style="width:0"></i>
  </div>
  <div class="legend">
    <span class="in" id="totIn"></span>
    <span class="out" id="totOut"></span>
  </div>
<section>
    <h2>Add a transaction</h2>
    <form id="f">
      <div class="seg full" role="group" aria-label="Transaction type">
        <button type="button" id="tOut" aria-pressed="true">Expense</button>
        <button type="button" id="tIn" aria-pressed="false">Income</button>
      </div>
      <label class="full">Description
        <input id="desc" required maxlength="60" placeholder="Groceries, salary, rent">
      </label>
      <label>Amount
        <input id="amt" type="number" min="0.01" step="0.01" required inputmode="decimal">
      </label>
      <label>Date
        <input id="date" type="date" required>
      </label>
      <label class="full" id="catWrap">Category
        <select id="cat">
          <option>Food</option>
          <option>Transport</option>
          <option>Housing</option>
          <option>Bills</option>
          <option>Health</option>
          <option>Leisure</option>
          <option>Other</option>
        </select>
      </label>
      <button class="add full" type="submit">Add transaction</button>
    </form>
  </section>

  <section class="cats">
    <h2>Spending by category</h2>
    <div id="cats"></div>
  </section>

  <section>
    <h2>Transactions</h2>
    <ul id="list"></ul>
  </section>
</main>

<script src="script.js"></script>        
</body>
</html>
